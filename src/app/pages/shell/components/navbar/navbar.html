<header class="navbar">
  <div class="navbar-container">
    <!-- Brand -->
    <a routerLink="/home" class="brand" aria-label="LifeStack Home">
      <span class="brand-icon">◈</span>
      <span class="brand-name">Life<span class="gradient-text">Stack</span></span>
    </a>

    <!-- Navigation Links -->
    <nav class="nav-links" aria-label="Primary navigation">
      <a
        routerLink="/home"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link">
        Overview
      </a>
      <!-- Ready for future feature routes -->
      <span class="nav-link disabled" aria-disabled="true" title="Coming soon">Finances</span>
      <span class="nav-link disabled" aria-disabled="true" title="Coming soon">Habits</span>
      <span class="nav-link disabled" aria-disabled="true" title="Coming soon">Milestones</span>
    </nav>

    <!-- User Profile & Action -->
    <div class="nav-actions">
      @if (currentUser(); as user) {
        <div class="user-chip">
          @if (user.photoURL) {
            <img
              [src]="user.photoURL"
              [alt]="displayName()"
              referrerpolicy="no-referrer"
              class="avatar" />
          } @else {
            <div class="avatar-placeholder">{{ userInitial() }}</div>
          }
          <span class="user-name">{{ displayName() }}</span>
        </div>
      }

      <button
        type="button"
        class="btn-signout"
        (click)="handleLogout()"
        [disabled]="auth.isLoading()"
        title="Sign Out">
        <span>Sign Out</span>
      </button>
    </div>
  </div>
</header>
