name: Deploy to Firebase on merge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy:
    name: Build, Verify & Deploy (Production)
    runs-on: ubuntu-latest
    environment: production
    env:
      FIREBASE_PROJECT_ID: lifestack-371ab
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Configure production environment.ts
        env:
          FIREBASE_ENV_CONTENT: ${{ secrets.FIREBASE_ENV_TS }}
        run: |
          if [ -z "$FIREBASE_ENV_CONTENT" ]; then
            echo "::error::FIREBASE_ENV_TS secret is missing or empty. Refusing to deploy placeholder configuration to production."
            exit 1
          fi
          mkdir -p src/environments
          printf "%s\n" "$FIREBASE_ENV_CONTENT" > src/environments/environment.ts

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Cloud Functions dependencies
        run: npm --prefix functions ci

      - name: Run frontend unit tests
        run: npm run test:ci

      - name: Build Angular production bundle
        run: npm run build

      - name: Build Cloud Functions TypeScript
        run: npm run build:functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIFESTACK_371AB }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@^15.34.1 --no-fund --no-audit

      - name: Deploy Firestore, Cloud Functions & Hosting
        run: |
          firebase deploy \
            --only firestore,functions,hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive \
            --force
