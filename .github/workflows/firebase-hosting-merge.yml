# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Setup environment.ts
        env:
          FIREBASE_ENV_CONTENT: ${{ secrets.FIREBASE_ENV_TS }}
        run: |
          mkdir -p src/environments
          if [ -n "$FIREBASE_ENV_CONTENT" ]; then
            printf "%s\n" "$FIREBASE_ENV_CONTENT" > src/environments/environment.ts
          else
            echo "::warning::FIREBASE_ENV_TS secret is missing; falling back to environment.example.ts"
            cp src/environments/environment.example.ts src/environments/environment.ts
          fi
      - run: npm ci && npm run build
      - name: Deploy Cloud Functions and Firestore Rules
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIFESTACK_371AB }}
        run: |
          npm --prefix functions ci
          echo "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp_key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp_key.json"
          npx -y firebase-tools@latest deploy --only functions,firestore:rules --project lifestack-371ab
          rm -f "$RUNNER_TEMP/gcp_key.json"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIFESTACK_371AB }}
          channelId: live
          projectId: lifestack-371ab
