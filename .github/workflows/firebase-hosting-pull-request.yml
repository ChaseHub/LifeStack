name: Preview Firebase Hosting on PR

on:
  pull_request:
    branches:
      - main

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: firebase-preview-pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build_and_preview:
    name: Verify & Deploy Preview Channel
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: lifestack-371ab
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Configure environment.ts
        env:
          FIREBASE_ENV_CONTENT: ${{ secrets.FIREBASE_ENV_TS }}
        run: |
          mkdir -p src/environments
          if [ -n "$FIREBASE_ENV_CONTENT" ]; then
            printf "%s\n" "$FIREBASE_ENV_CONTENT" > src/environments/environment.ts
          else
            echo "::warning::FIREBASE_ENV_TS secret is unavailable; using environment.example.ts for build verification."
            cp src/environments/environment.example.ts src/environments/environment.ts
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Cloud Functions dependencies
        run: npm --prefix functions ci

      - name: Run frontend unit tests
        run: npm run test:ci

      - name: Build Angular bundle
        run: npm run build

      - name: Build Cloud Functions TypeScript
        run: npm run build:functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIFESTACK_371AB }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@^15.34.1 --no-fund --no-audit

      - name: Deploy to Firebase Hosting preview channel
        id: preview_deploy
        run: |
          CHANNEL_ID="pr-${{ github.event.number }}"
          DEPLOY_JSON=$(firebase hosting:channel:deploy "$CHANNEL_ID" \
            --expires 7d \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive \
            --json)
          PREVIEW_URL=$(printf "%s" "$DEPLOY_JSON" | jq -r '.result | to_entries[0].value.url')
          EXPIRE_TIME=$(printf "%s" "$DEPLOY_JSON" | jq -r '.result | to_entries[0].value.expireTime')
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "expires=$EXPIRE_TIME" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on Pull Request
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.preview_deploy.outputs.url }}
          EXPIRE_TIME: ${{ steps.preview_deploy.outputs.expires }}
        with:
          script: |
            const marker = '<!-- firebase-hosting-preview-comment -->';
            const body = [
              marker,
              `### ⚡ Firebase Hosting Preview Ready`,
              ``,
              `- **Preview URL:** ${process.env.PREVIEW_URL}`,
              `- **Commit:** \`${context.payload.pull_request.head.sha.slice(0, 7)}\``,
              `- **Expires:** \`${process.env.EXPIRE_TIME}\``
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
